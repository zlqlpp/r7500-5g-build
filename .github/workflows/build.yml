name: Build R7500v1 5G

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -a -f || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget qemu-utils \
            subversion time xsltproc docbook-xsl libelf-dev

      - name: Clone Lean's lede
        run: |
          git clone https://github.com/coolsnowwolf/lede -b master openwrt --depth=1

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Verify quantenna package present
        run: |
          cd openwrt
          test -f package/firmware/quantenna/Makefile \
            && echo "quantenna package FOUND" \
            || (echo "quantenna package MISSING" && exit 1)

      - name: Apply config
        run: |
          cp .config openwrt/.config

      - name: Show final config (relevant parts only)
        run: |
          cd openwrt
          make defconfig
          grep -E "TARGET_ipq806x|netgear_r7500|qtn|quantenna|qcsapi" .config || true

      - name: Download sources
        run: |
          cd openwrt
          make -j$(nproc) download V=s

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s || make -j1 V=s

      - name: Collect artifacts
        run: |
          cd openwrt
          mkdir -p ../out
          cp bin/targets/ipq806x/generic/*.bin ../out/ 2>/dev/null || true
          cp bin/targets/ipq806x/generic/*.img ../out/ 2>/dev/null || true
          cp bin/targets/ipq806x/generic/*.manifest ../out/ 2>/dev/null || true
          cp .config ../out/config.used
          ls -la ../out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: r7500-firmware
          path: out/
          retention-days: 30
