name: Build R7500v1 5G

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Max free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/node_modules /opt/az /usr/share/swift \
                      /usr/local/graalvm /usr/local/.ghcup /usr/share/miniconda \
                      /usr/local/share/chromium /usr/local/share/powershell \
                      /usr/lib/firefox /opt/microsoft 2>/dev/null || true
          sudo apt-get -qq purge -y '^dotnet-.*' '^llvm-.*' '^mongodb-.*' '^mysql-.*' 2>/dev/null || true
          sudo apt-get -qq autoremove -y 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*.deb
          sudo docker image prune -a -f 2>/dev/null || true
          sudo rm -rf /var/lib/docker 2>/dev/null || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget qemu-utils \
            subversion time xsltproc docbook-xsl libelf-dev

      - name: Clone Lean's lede
        run: git clone https://github.com/coolsnowwolf/lede -b master openwrt --depth=1

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Verify quantenna
        run: |
          cd openwrt
          test -f package/firmware/quantenna/Makefile && echo "quantenna FOUND" || exit 1

      - name: Apply config and validate
        run: |
          cp .config openwrt/.config
          cd openwrt
          make defconfig
          echo "=== packages: $(grep -cE '^CONFIG_PACKAGE_.*=y' .config) ==="
          echo "=== quantenna ==="
          grep -E "qtn-|quantenna" .config || (echo "FATAL: quantenna missing" && exit 1)
          echo "=== target ==="
          grep -E "TARGET_BOARD|TARGET_PROFILE" .config
          echo "=== node check (must be absent) ==="
          if grep -qE "^CONFIG_PACKAGE_node=y" .config; then
            echo "FATAL: node got pulled back in by defconfig!"
            echo "--- who depends on node ---"
            grep -E "^CONFIG_PACKAGE_.*(aliyun|node)" .config
            exit 1
          fi
          echo "OK: node not present"
          echo "=== e2guardian check ==="
          grep -qE "^CONFIG_PACKAGE_e2guardian=y" .config && (echo "FATAL: e2guardian present" && exit 1) || echo "OK: e2guardian absent"

      - name: Download sources
        run: |
          cd openwrt
          make -j$(nproc) download V=s
          df -h /

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s > /tmp/build.log 2>&1
          echo "BUILD_EXIT=$?"
        continue-on-error: true

      - name: Diagnose
        if: always()
        run: |
          echo "===== FAILED PACKAGES ====="
          grep -oE "ERROR: package/[^ ]+ failed to build" /tmp/build.log | sort -u || echo "none"
          echo "===== ERROR LINES ====="
          grep -nE "make\[[0-9]\]: \*\*\*.*Error [12]$|^Error|error:" /tmp/build.log | tail -30 || true
          echo "===== LAST 80 LINES ====="
          tail -80 /tmp/build.log || true
          echo "===== DISK ====="
          df -h /

      - name: Check result
        id: check
        run: |
          ls -la openwrt/bin/targets/ipq806x/generic/ 2>/dev/null || true
          if ls openwrt/bin/targets/ipq806x/generic/*sysupgrade.bin >/dev/null 2>&1; then
            echo "ok=1" >> $GITHUB_OUTPUT
            echo "=== BUILD SUCCESS ==="
          else
            echo "ok=0" >> $GITHUB_OUTPUT
            echo "=== BUILD FAILED ==="
          fi

      - name: Collect artifacts
        if: steps.check.outputs.ok == '1'
        run: |
          cd openwrt
          mkdir -p ../out
          cp bin/targets/ipq806x/generic/*.bin ../out/ 2>/dev/null || true
          cp bin/targets/ipq806x/generic/*.img ../out/ 2>/dev/null || true
          cp bin/targets/ipq806x/generic/*.manifest ../out/ 2>/dev/null || true
          cp .config ../out/config.used
          ls -la ../out

      - name: Upload firmware
        if: steps.check.outputs.ok == '1'
        uses: actions/upload-artifact@v4
        with:
          name: r7500-firmware
          path: out/
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7

      - name: Fail if build failed
        if: steps.check.outputs.ok != '1'
        run: exit 1
