name: Build R7500v1 5G

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Max free disk space
        run: |
          echo "=== BEFORE ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/node_modules /opt/az /usr/share/swift \
                      /usr/local/graalvm /usr/local/.ghcup /usr/share/miniconda \
                      /usr/local/share/chromium /usr/local/share/powershell \
                      /usr/lib/firefox /opt/microsoft 2>/dev/null || true
          sudo apt-get -qq purge -y '^dotnet-.*' '^llvm-.*' '^mongodb-.*' '^mysql-.*' 2>/dev/null || true
          sudo apt-get -qq autoremove -y 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*.deb
          sudo docker image prune -a -f 2>/dev/null || true
          sudo rm -rf /var/lib/docker 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true
          echo "=== AFTER ==="
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget qemu-utils \
            subversion time xsltproc docbook-xsl libelf-dev

      - name: Clone Lean's lede (shallow)
        run: |
          git clone https://github.com/coolsnowwolf/lede -b master openwrt --depth=1

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Verify quantenna package present
        run: |
          cd openwrt
          test -f package/firmware/quantenna/Makefile \
            && echo "quantenna package FOUND" \
            || (echo "quantenna package MISSING" && exit 1)

      - name: Apply config
        run: |
          cp .config openwrt/.config
          cd openwrt
          make defconfig
          echo "=== packages enabled: $(grep -cE '^CONFIG_PACKAGE_.*=y' .config) ==="
          echo "=== quantenna ==="
          grep -E "qtn-|quantenna" .config || echo "!!! NO QUANTENNA !!!"
          echo "=== target ==="
          grep -E "TARGET_BOARD|TARGET_PROFILE|TARGET_SUBTARGET" .config

      - name: Download sources
        run: |
          cd openwrt
          make -j$(nproc) download V=s
          df -h /

      - name: Build firmware
        run: |
          cd openwrt
          df -h /
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tail -200
          echo "=== BUILD OK ==="
          df -h /

      - name: Collect artifacts
        if: success()
        run: |
          cd openwrt
          mkdir -p ../out
          cp bin/targets/ipq806x/generic/*.bin ../out/ 2>/dev/null || true
          cp bin/targets/ipq806x/generic/*.img ../out/ 2>/dev/null || true
          cp bin/targets/ipq806x/generic/*.manifest ../out/ 2>/dev/null || true
          cp .config ../out/config.used
          ls -la ../out

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r7500-firmware
          path: out/
          retention-days: 30
          if-no-files-found: error
